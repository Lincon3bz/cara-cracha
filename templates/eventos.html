<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>cara-crachá</title>
</head>
<body>
    <h1>Eventos</h1>
    <ul>
        {{range .}}
        <li>{{.Nome}}({{.Data}})</li>
        {{else}}
        <li>Nenhum evento ainda.</li>
        {{end}}
    </ul>
    <h2>Novo evento</h2>
    <form method="post" action="/eventos">
        <label>Nome<input name="nome"></label>
        <label>Data<input name="data"></label>
        <button>Criar</button>
    </form>
</body>
</html>
